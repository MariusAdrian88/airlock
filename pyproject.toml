[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airlock"
dynamic = ["version"]
description = "Lean Ghidra MCP server for clean-room reverse engineering"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Marius Stanciu" }]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "json5>=0.9",
  "pefile>=2023.2.7",
  "olefile>=0.46",
  "dnfile>=0.15",
]
# pyghidra is deliberately NOT a dependency: it must match the Ghidra install,
# so `airlock doctor --fix` installs it from the wheels bundled with Ghidra.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "capstone>=5"]
# capstone decodes x86 for `airlock delphi-sigs build` only; matching needs no decoder
sigs = ["capstone>=5"]

[project.scripts]
airlock = "airlock.cli:main"

[tool.hatch.version]
path = "src/airlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import each other as "tests.<module>"; "pytest" (not "python -m pytest") needs the repo root on the path
pythonpath = ["."]
# Parallel by default (pytest-xdist), at most 8 workers. Ghidra runs (--binary/--xbin) run serially.
addopts = "-n auto --maxprocesses=8"
